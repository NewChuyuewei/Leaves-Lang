name: Build and regression tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            platform: linux
            flags: ""
          - name: iso-c89
            platform: iso-c89
            flags: ""
          - name: iso-c99
            platform: iso-c99
            flags: ""
          - name: assertions
            platform: linux
            flags: "-DLUAI_ASSERT -DLUA_USE_APICHECK"
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make ${{ matrix.platform }} -j2 MYCFLAGS="${{ matrix.flags }}"
      - name: Regression suite
        run: python3 test/leaves/run.py
      - name: Examples
        run: |
          ./src/leav examples/shapes.leav
          ./src/leav examples/wallet.leav
